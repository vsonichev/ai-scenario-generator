[project]
name = "ai-scenario-generator"
version = "0.1.0"
description = "AI tools for generate text scenario"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "openai>=2.33.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_scenario"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
indent-width = 4
